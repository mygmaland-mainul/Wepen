
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEPEN - Social Media</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>WEPEN</h1>
        <p>Connect with the world.</p>
    </header>

    <main>
        <section class="welcome">
            <h2>Welcome to WEPEN!</h2>
            <p>Share your moments with everyone.</p>
        </section>

        <section class="post-box">
            <h3>Create a Post</h3>
            <textarea placeholder="What's on your mind?"></textarea>
            <button>Post</button>
        </section>

        <section class="feed">
            <h3>News Feed</h3>
            <p>No posts yet. Be the first to post!</p>
        </section>
    </main>

    <footer>
        <p>© 2026 WEPEN. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
